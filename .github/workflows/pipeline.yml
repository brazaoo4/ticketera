name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (e.g. 2.2.0)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  validate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ticketera"
        run: npx prisma generate

      - name: Run Unit Tests
        run: npm test

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ticketera"
        run: npm run build

  release-please:
    name: Release Please
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-matrix:
    name: Build (${{ matrix.platform }})
    needs: [validate, release-please]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract base metadata & OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=Ticketera
            org.opencontainers.image.description=Self-hosted Spanish grocery receipt scanner, unit-price normalizer, and personal inflation tracker
            org.opencontainers.image.source=https://github.com/brazaoo4/ticketera
            org.opencontainers.image.url=https://github.com/brazaoo4/ticketera
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push by digest (Native Silicon)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.artifact }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    name: Merge Multi-Arch Manifests
    needs: [release-please, build-matrix]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ needs.release-please.outputs.tag_name }}" ]; then
            echo "tag=${{ needs.release-please.outputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Extract Docker metadata & OCI labels
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != 'latest' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != 'latest' }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != 'latest' }}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != 'latest' }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=Ticketera
            org.opencontainers.image.description=Self-hosted Spanish grocery receipt scanner, unit-price normalizer, and personal inflation tracker
            org.opencontainers.image.source=https://github.com/brazaoo4/ticketera
            org.opencontainers.image.url=https://github.com/brazaoo4/ticketera
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create multi-platform manifest and push tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          readarray -t tags < <(jq -r '.tags[]? // empty' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for t in "${tags[@]}"; do
            [[ -n "$t" ]] && tag_args+=(--tag "$t")
          done

          readarray -t annotations < <(jq -r '.annotations[]? // empty' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          annotation_args=()
          for a in "${annotations[@]}"; do
            [[ -z "$a" ]] && continue
            # imagetools create only supports 'index:' or 'manifest-descriptor:'
            # Rewrite any 'manifest:' prefix to 'index:'
            a="${a/#manifest:/index:}"
            if [[ "$a" != index:* && "$a" != manifest-descriptor:* ]]; then
              a="index:$a"
            fi
            annotation_args+=(--annotation "$a")
          done

          images=()
          for f in *; do
            [[ -f "$f" ]] && images+=("ghcr.io/${{ github.repository }}@sha256:$f")
          done

          docker buildx imagetools create "${tag_args[@]}" "${annotation_args[@]}" "${images[@]}"

      - name: Inspect final multi-platform image
        run: |
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
