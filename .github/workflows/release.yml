name: Release & Publish Container Image

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.0.0)"
        required: false
        default: "2.0.0"
        type: string
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. v2.0.2)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Push GHCR Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version || github.event.inputs.version || '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version || github.event.inputs.version || '' }}
            type=semver,pattern={{major}},value=${{ inputs.version || github.event.inputs.version || '' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Ticketera
            org.opencontainers.image.description=Self-hosted Spanish grocery receipt scanner, unit-price normalizer, and personal inflation tracker
            org.opencontainers.image.source=https://github.com/brazaoo4/ticketera
            org.opencontainers.image.url=https://github.com/brazaoo4/ticketera
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
